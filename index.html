<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6c5ce7"><title>بازی ریاضی پایه دوم ابتدایی | خانم فاطمه کریمی اسکندری</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f8f7ff,#eef8ff);color:#25233a}header{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#6c5ce7,#8e7dff);color:#fff}h1{margin:0 0 8px;font-size:clamp(24px,6vw,38px)}header p{margin:0;font-size:16px}main{max-width:850px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}button{border:0;border-radius:15px;padding:14px 12px;font:inherit;cursor:pointer;background:#eee9ff;color:#40357e;font-weight:bold}button:hover{transform:translateY(-1px)}button.primary{background:#6c5ce7;color:#fff}.hidden{display:none}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:bold;margin-bottom:16px}.question{font-size:25px;text-align:center;padding:22px 8px;background:#f7f6ff;border-radius:18px;margin-bottom:15px;line-height:1.8}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button{background:#f1f0ff;border:2px solid #e4e0ff;font-size:20px}.feedback{text-align:center;min-height:30px;font-weight:bold;margin-top:12px}.back{background:#eee}</style></head><body><header><h1>🎮 بازی ریاضی پایه دوم ابتدایی</h1><p>خانم فاطمه کریمی اسکندری</p></header><main><section id="home" class="card"><h2>🌟 آماده‌ای برای بازی؟</h2><p>موضوع و سطح را انتخاب کن و امتیاز بگیر!</p><h3>موضوع</h3><div id="topics" class="grid"></div><h3>سطح</h3><div id="levels" class="grid"></div><br><button class="primary" onclick="startGame()">🚀 شروع بازی</button></section><section id="game" class="card hidden"><div class="stats"><span>⭐ امتیاز: <b id="score">0</b></span><span>❤️ جان: <b id="lives">3</b></span><span>سؤال: <b id="count">1</b>/10</span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><br><button class="back" onclick="goHome()">↩ بازگشت</button></section><section id="result" class="card hidden" style="text-align:center"><h2>🎉 بازی تمام شد!</h2><p id="resultText"></p><button class="primary" onclick="startGame()">دوباره بازی کن</button> <button class="back" onclick="goHome()">انتخاب موضوع</button></section></main><script>
const topics=[['اعداد','numbers'],['جمع و تفریق','addsub'],['حدس بزن','missing'],['تقریب دهگان','round'],['اشکال هندسی','shapes'],['قرینه','symmetry'],['آمار','stats'],['الگویابی','patterns'],['تقارن چهارقسمتی','four']];const levels=[['آسان','easy'],['متوسط','medium'],['چالشی','hard']];let topic='numbers',level='easy',score=0,lives=3,count=0,current=null;const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const uniq=a=>[...new Set(a.map(String))];function shuffle(a){return a.sort(()=>Math.random()-.5)}topics.forEach(([n,id])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{topic=id;document.querySelectorAll('#topics button').forEach(x=>x.classList.remove('primary'));b.classList.add('primary')};topicsEl.appendChild(b)});levels.forEach(([n,id])=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{level=id;document.querySelectorAll('#levels button').forEach(x=>x.classList.remove('primary'));b.classList.add('primary')};levelsEl.appendChild(b)});topicsEl.children[0].classList.add('primary');levelsEl.children[0].classList.add('primary');
function makeQuestion(){let q,ans,opts;const hard=level==='hard',med=level==='medium';if(topic==='numbers'){const ones=['صفر','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'],tens=['','ده','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];const word=n=>n<10?ones[n]:tens[Math.floor(n/10)]+(n%10?' و '+ones[n%10]:'');ans=rnd(10,99);q=`عدد ${fa(ans)} را به حروف چگونه می‌خوانیم؟`;opts=uniq([word(ans),word(rnd(10,99)),word(rnd(10,99)),word(rnd(10,99))]);while(opts.length<4)opts=uniq([...opts,word(rnd(10,99))]);return{q,ans:word(ans),opts}}if(topic==='addsub'){let a=rnd(10,50),b=rnd(5,35),op=Math.random()<.5?'+':'-';if(op==='-'&&b>a)[a,b]=[b,a];ans=op==='+'?a+b:a-b;q=`${fa(a)} ${op} ${fa(b)} = ؟`;opts=uniq([ans,ans+1,Math.max(0,ans-1),ans+5]);return{q,ans:String(ans),opts:opts.map(fa)}}if(topic==='missing'){let a=rnd(10,40),x=rnd(5,35),sum=a+x;ans=x;q=`${fa(a)} + □ = ${fa(sum)}  ؛ عدد گمشده چیست؟`;opts=uniq([x,x+2,x-2,x+5].filter(v=>v>=0));while(opts.length<4)opts.push(x+opts.length+7);return{q,ans:String(ans),opts:opts.map(fa)}}if(topic==='round'){let a=rnd(10,89),lo=Math.floor(a/10)*10,hi=lo+10;ans=(a-lo<hi-a)?lo:(a-lo>hi-a?hi:hi);q=`${fa(a)} به کدام دهگان نزدیک‌تر است؟`;opts=uniq([lo,hi,Math.max(10,lo-10),Math.min(90,hi+10)]).filter(v=>v>=10&&v<=90);return{q,ans:String(ans),opts:opts.map(fa)}}if(topic==='shapes'){const d=[['مربع','۴ ضلع مساوی'],['مستطیل','۴ ضلع دارد و ضلع‌های روبه‌رو برابرند'],['لوزی','۴ ضلع مساوی دارد'],['مثلث','۳ ضلع دارد'],['دایره','ضلع و گوشه ندارد']];let i=rnd(0,d.length-1);q=`کدام شکل ${d[i][1]}؟`;ans=d[i][0];opts=shuffle(d.map(x=>x[0])).slice(0,4);if(!opts.includes(ans))opts[3]=ans;return{q,ans,opts}}if(topic==='symmetry'){const d=[['مربع','بله'],['مستطیل','بله'],['دایره','بله'],['مثلث معمولی','خیر']];let i=rnd(0,d.length-1);q=`آیا «${d[i][0]}» خط تقارن دارد؟`;ans=d[i][1];return{q,ans,opts:['بله','خیر']}}if(topic==='stats'){let b=rnd(2,5),v=[b+2,b,b-1,b+1],names=['سیب','موز','پرتقال','گلابی'],i=v.indexOf(Math.max(...v));q=`تعداد میوه‌ها: سیب ${fa(v[0])}، موز ${fa(v[1])}، پرتقال ${fa(v[2])}، گلابی ${fa(v[3])}. کدام بیشتر است؟`;return{q,ans:names[i],opts:shuffle(names)}}if(topic==='patterns'){let start=rnd(2,15),step=hard?3:(med?2:1),a=[start,start+step,start+2*step];ans=start+3*step;q=`الگو را ادامه بده: ${fa(a[0])}، ${fa(a[1])}، ${fa(a[2])}، ؟`;return{q,ans:fa(ans),opts:[ans,ans+1,ans-1,ans+step+2].map(fa)}}ans=Math.random()<.5?'بله':'خیر';q='آیا این الگوی چهارقسمتی از نظر تقارن درست است؟';return{q,ans,opts:['بله','خیر']}}
function startGame(){score=0;lives=3;count=0;home.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');next()}function next(){if(lives<=0||count>=10)return finish();count++;scoreEl.textContent=score;livesEl.textContent=lives;countEl.textContent=count;current=makeQuestion();question.textContent=current.q;answers.innerHTML='';feedback.textContent='';shuffle([...current.opts]).forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(o);answers.appendChild(b)})}function answer(o){[...answers.children].forEach(x=>x.disabled=true);if(String(o)===String(current.ans)){score+=10;feedback.textContent='✅ آفرین! پاسخ درست است.'}else{lives--;feedback.textContent=`❌ پاسخ درست: ${current.ans}`}scoreEl.textContent=score;livesEl.textContent=lives;setTimeout(next,650)}function finish(){game.classList.add('hidden');result.classList.remove('hidden');resultText.textContent=`امتیاز شما: ${fa(score)} از ${fa(100)} ⭐`}function goHome(){game.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden')}const topicsEl=document.getElementById('topics'),levelsEl=document.getElementById('levels'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),countEl=document.getElementById('count'),home=document.getElementById('home'),game=document.getElementById('game'),result=document.getElementById('result'),question=document.getElementById('question'),answers=document.getElementById('answers'),feedback=document.getElementById('feedback');</script></body></html>
